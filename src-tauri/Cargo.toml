[package]
name = "humanizer"
version = "0.2.0"
description = "Humanizer - rewrite AI-assisted text so it reads naturally, with a built-in AI-detection suite"
authors = ["Arun Pandey (Arun AI Studio)"]
edition = "2021"
rust-version = "1.90"

[lib]
name = "humanizer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
regex = "1"
pdf-extract = "0.9"
once_cell = "1"
futures = "0.3"
sysinfo = { version = "0.33", default-features = false, features = ["system"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
panic = "abort"

# Local AI engine (llama.cpp). Metal on macOS, OpenMP-accelerated CPU elsewhere.
[target.'cfg(target_os = "macos")'.dependencies]
llama-cpp-2 = { version = "0.1.160", default-features = false, features = ["metal"] }

[target.'cfg(not(target_os = "macos"))'.dependencies]
llama-cpp-2 = { version = "0.1.160", default-features = false, features = ["openmp"] }
