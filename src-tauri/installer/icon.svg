<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1e1b4b"/>
      <stop offset="0.55" stop-color="#4338ca"/>
      <stop offset="1" stop-color="#0ea5e9"/>
    </linearGradient>
    <linearGradient id="nib" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fef3c7"/>
      <stop offset="1" stop-color="#f59e0b"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect x="64" y="64" width="896" height="896" rx="200" fill="url(#bg)"/>
  <!-- soft highlight -->
  <ellipse cx="330" cy="260" rx="300" ry="170" fill="#fff" opacity="0.08"/>
  <!-- letter H built from two pen strokes -->
  <g filter="url(#shadow)" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M300 300 V724" stroke="#fff" stroke-width="86"/>
    <path d="M300 512 H560" stroke="#fff" stroke-width="86"/>
    <!-- second stroke becomes a quill -->
    <path d="M700 300 V560" stroke="#fff" stroke-width="86"/>
  </g>
  <!-- quill feather -->
  <g filter="url(#shadow)">
    <path d="M700 560 C 690 660, 620 740, 540 800 C 600 790, 680 760, 740 700 C 790 650, 790 590, 760 540 Z" fill="url(#nib)"/>
    <path d="M700 560 C 690 660, 620 740, 540 800" stroke="#b45309" stroke-width="10" fill="none" stroke-linecap="round"/>
  </g>
  <!-- ink dot -->
  <circle cx="520" cy="830" r="26" fill="#fde68a"/>
</svg>
