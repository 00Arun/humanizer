# When a version tag (v1.2.3) is pushed, build the Windows installer and the
# Intel-Mac DMG on GitHub's runners and commit them into releases/ on main,
# replacing the previous ones. The Apple-Silicon DMG is built locally by
# scripts/release.sh. No secrets are needed.

name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ""
            bundle: nsis
            optional: false
          - platform: macos-latest
            args: --target x86_64-apple-darwin
            bundle: dmg
            optional: true
    runs-on: ${{ matrix.platform }}
    # The Intel-Mac cross build of llama.cpp is best-effort.
    continue-on-error: ${{ matrix.optional == true }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'x86_64-apple-darwin' || '' }}
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      # llama.cpp is compiled from source; cmake ships on the hosted runners.
      - run: cmake --version
      - run: npm ci
      - run: npm run tauri build -- ${{ matrix.args }} --bundles ${{ matrix.bundle }}
      - uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.platform }}
          path: |
            src-tauri/target/**/release/bundle/nsis/*-setup.exe
            src-tauri/target/**/release/bundle/dmg/*.dmg
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          lfs: true
      # Installers in releases/ are Git LFS objects.
      - run: git lfs install
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Replace previous installers in releases/
        run: |
          set -euo pipefail
          mkdir -p releases
          rm -f releases/*-setup.exe releases/Humanizer_*_x64.dmg
          find artifacts -name '*-setup.exe' -exec cp {} releases/ \;
          find artifacts -name '*.dmg' -exec cp {} releases/ \;
          ls -la releases
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add releases
          git diff --cached --quiet && echo "nothing new" && exit 0
          git commit -m "Add installers for ${GITHUB_REF_NAME}"
          git push origin main
